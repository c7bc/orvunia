name: Windows Local native reporting QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-local-native-qa
  cancel-in-progress: false
jobs:
  reporting:
    if: github.repository == 'c7bc/orvunia' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Preserve exact repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d6d95486f6fcc057df437c95304771997bcac0a9
          path: work/source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install frozen QA tools without lifecycle scripts
        run: bun install --cwd tests/windows --frozen-lockfile --ignore-scripts
      - name: Check contracts without running the app
        run: node --test (Get-ChildItem tests/windows/spec -Filter '*.test.mjs' | Select-Object -ExpandProperty FullName)
      - name: Establish owned runner paths
        id: qa
        run: node tests/windows/prepare.mjs
      - name: Build and audit exact Local package
        run: node tests/windows/build.mjs '${{ steps.qa.outputs.state }}' '${{ github.workspace }}/work/source'
      - name: Seed only the owned synthetic profile
        run: node tests/windows/reporting/prepare.mjs '${{ steps.qa.outputs.state }}' '${{ github.workspace }}/work/source'
      - name: Run real native clipboard and instrumented reporting
        timeout-minutes: 5
        run: node tests/windows/reporting/native.mjs '${{ steps.qa.outputs.state }}'
      - name: Check owned process cleanup
        timeout-minutes: 2
        if: always() && steps.qa.outputs.state != ''
        run: pwsh -NoProfile -File tests/windows/reporting/cleanup.ps1 -State '${{ steps.qa.outputs.state }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.qa.outputs.evidence != ''
        with:
          name: local-native-reporting-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.qa.outputs.evidence }}
          retention-days: 1
          if-no-files-found: error
